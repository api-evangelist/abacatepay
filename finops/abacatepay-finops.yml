meters:
- name: pix_transactions
  description: Received Pix payments billed at a flat fee per successful transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
- name: recurring_pix_installments
  description: Paid recurring Pix installments billed at the standard flat Pix fee.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - subscription
- name: card_transactions
  description: Approved credit card transactions billed as a percentage plus a fixed fee.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
- name: boleto_transactions
  description: Paid boletos billed at a flat fee per boleto, reduced when paid via embedded Pix QR Code.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
- name: withdrawals
  description: Withdrawal (payout) requests billed per request, stepping up after the first 20 per month.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - month
principles:
- name: Visibility
  description: Reconcile billings, Pix QR Code payments, and withdrawals against the store balance (available, pending, blocked) via the API.
- name: Allocation
  description: Tag billings and withdrawals with externalId and metadata to map payment costs to internal workloads, teams, or customers.
- name: Optimization
  description: Prefer Pix over card to minimize per-transaction fees; batch payouts to stay within the cheaper first-20-withdrawals-per-month tier; steer boleto payers to the embedded Pix QR Code.
- name: Accountability
  description: Review monthly transaction-fee and withdrawal-fee totals against revenue; assign owners per payment integration.
