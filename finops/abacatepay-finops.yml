description: >-
  FinOps view of AbacatePay spend. AbacatePay bills flat per-transaction fees:
  a fixed fee per received Pix payment (and per recurring Pix installment), a
  percentage-plus-fixed fee per approved credit card transaction, a fixed fee
  per paid boleto, and a per-request withdrawal fee that steps up after the
  first 20 withdrawals each month. Generating a Pix QR Code is free; cost is
  incurred only on successful payments and on payouts. All amounts are in
  Brazilian Reais (BRL).
notes: >-
  Per-transaction rates are sourced from the public pricing page and are not
  reconciled against a live account or invoice in this artifact. Verify against
  the AbacatePay pricing page during reconciliation.
