openapi: 3.2.0
info:
  title: AbacatePay Products API
  description: API para gerenciamento de cobranças e pagamentos usando o AbacatePay.
  version: 1.0.0
servers:
- url: https://api.abacatepay.com/v2
  description: Único servidor para os ambientes de produção e sandbox.
tags:
- name: Products
paths:
  /products/create:
    post:
      summary: Criar um produto
      description: 'Permite que você crie um novo produto que pode ser usado em cobranças.

        Produtos podem ser avulsos (pagamento único) ou de assinatura; use o campo opcional `cycle` para definir a recorrência (`WEEKLY`, `MONTHLY`, `QUARTERLY`, `SEMIANNUALLY`, `ANNUALLY`). Quando `cycle` é omitido ou `null`, o produto é avulso.


        **Alternativa**: Você também pode criar e gerenciar seus produtos pelo Dashboard da AbacatePay.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados necessários para criar um produto.
              required:
              - externalId
              - name
              - price
              - currency
              additionalProperties: false
              example:
                externalId: prod-123
                name: Produto Exemplo
                price: 10000
                currency: BRL
              properties:
                externalId:
                  type: string
                  description: Identificador único do produto no seu sistema.
                  example: prod-123
                name:
                  type: string
                  description: Nome do produto.
                  example: Produto Exemplo
                price:
                  type: number
                  description: Preço do produto em centavos.
                  minimum: 1
                  example: 10000
                currency:
                  type: string
                  description: Moeda do produto.
                  default: BRL
                  example: BRL
                description:
                  type: string
                  description: Descrição opcional do produto.
                  example: Descrição do produto
                  x-mint:
                    hidden: true
                imageUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: URL da imagem do produto. Opcional.
                  example: null
                fileUrl:
                  type: string
                  format: uri
                  description: 'URL pública de um PDF a ser vinculado ao produto. Opcional. O arquivo é baixado e armazenado pela AbacatePay — máximo 20 MB. Após o pagamento, o comprador recebe acesso ao download do arquivo.

                    '
                  example: https://exemplo.com/meu-ebook.pdf
                cycle:
                  type: string
                  nullable: true
                  description: 'Opcional. Indica se o produto é uma assinatura. Quando omitido ou `null`, o produto é avulso (pagamento único).

                    Valores possíveis: `WEEKLY`, `MONTHLY`, `QUARTERLY`, `SEMIANNUALLY`, `ANNUALLY`.

                    '
                  enum:
                  - WEEKLY
                  - MONTHLY
                  - QUARTERLY
                  - SEMIANNUALLY
                  - ANNUALLY
                  example: null
                image:
                  type: string
                  format: uri
                  description: URL da imagem do produto.
                  example: https://cdn.exemplo.com/produto.png
                trialDays:
                  type: integer
                  description: Dias de teste gratuito antes da primeira cobrança. Só se aplica a produtos com `cycle` definido.
                  minimum: 1
                  maximum: 90
                  example: 7
      responses:
        '200':
          description: Produto criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Products
      operationId: postProductsCreate
      x-operation-id-source: derived
  /products/list:
    get:
      summary: Listar produtos
      description: 'Retorna todos os produtos que você criou com suporte a paginação.


        Você pode usar essa rota para visualizar todos os seus produtos, incluindo status, preços, ciclo de assinatura (quando aplicável) e demais informações.


        **Alternativa**: Você também pode visualizar e gerenciar seus produtos pelo Dashboard da AbacatePay.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/QueryAfter'
      - $ref: '#/components/parameters/QueryBefore'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryStartDate'
      - $ref: '#/components/parameters/QueryEndDate'
      - name: id
        in: query
        description: Filtrar por identificador único do produto
        required: false
        schema:
          type: string
          example: prod_abc123xyz
      - name: externalId
        in: query
        description: Filtrar por identificador do produto no seu sistema
        required: false
        schema:
          type: string
          example: prod-123
      - name: status
        in: query
        description: Filtrar por status do produto
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: keyword
        in: query
        description: Busca textual livre
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filtrar por nome do produto
        required: false
        schema:
          type: string
      - name: currency
        in: query
        description: Filtrar por moeda do produto
        required: false
        schema:
          type: string
          example: BRL
      responses:
        '200':
          description: Lista de produtos retornada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de produtos.
                    items:
                      $ref: '#/components/schemas/Product'
                  success:
                    $ref: '#/components/schemas/Success'
                  error:
                    type: string
                    nullable: true
                    example: null
                  pagination:
                    $ref: '#/components/schemas/PaginationCursor'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Products
      operationId: getProductsList
      x-operation-id-source: derived
  /products/get:
    get:
      summary: Buscar um produto
      description: 'Retorna os dados de um produto específico baseado em filtros, incluindo o campo `cycle` (assinatura ou avulso).


        Você pode usar essa rota para buscar um produto por ID ou externalId.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        description: Identificador único público do produto
        required: false
        schema:
          type: string
          example: prod_abc123xyz
      - name: externalId
        in: query
        description: Identificador único do produto no seu sistema
        required: false
        schema:
          type: string
          example: prod-123
      - name: name
        in: query
        description: Nome do produto
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Produto encontrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro indicando que o produto não foi encontrado.
                    example: Produto não encontrado.
      tags:
      - Products
      operationId: getProductsGet
      x-operation-id-source: derived
  /products/delete:
    post:
      summary: Deletar um produto
      description: 'Remove um produto da sua loja (avulso ou de assinatura).


        Esta operação é irreversível. Use com cuidado.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        description: Identificador único público do produto a ser deletado
        schema:
          type: string
          example: prod_abc123xyz
      responses:
        '200':
          description: Produto deletado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro indicando que o produto não foi encontrado.
                    example: Produto não encontrado.
      tags:
      - Products
      operationId: postProductsDelete
      x-operation-id-source: derived
components:
  parameters:
    QueryStartDate:
      name: startDate
      in: query
      description: 'Filtra registros criados a partir desta data (inclusive). Formato `YYYY-MM-DD`. O intervalo é interpretado no fuso horário `America/Sao_Paulo` (00:00 do dia inicial).

        '
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-01'
    QueryEndDate:
      name: endDate
      in: query
      description: 'Filtra registros criados até esta data (inclusive). Formato `YYYY-MM-DD`. O intervalo é interpretado no fuso horário `America/Sao_Paulo` (23:59:59.999 do dia final).

        '
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-31'
    QueryLimit:
      name: limit
      in: query
      description: Quantidade de itens por página (1-100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
        example: 100
    QueryAfter:
      name: after
      in: query
      description: Cursor para buscar itens após este ponto (use o `publicId` retornado em `pagination.next`).
      required: false
      schema:
        type: string
    QueryBefore:
      name: before
      in: query
      description: Cursor para buscar itens antes deste ponto (use o `publicId` retornado em `pagination.before`).
      required: false
      schema:
        type: string
  schemas:
    Success:
      type: boolean
      description: Se a requisição obteve sucesso ou não.
      example: true
    PaginationCursor:
      type: object
      description: Informações de paginação baseada em cursor.
      required:
      - hasMore
      - next
      - before
      additionalProperties: false
      properties:
        hasMore:
          type: boolean
          description: Indica se existe uma próxima página.
        next:
          type: string
          nullable: true
          description: Cursor da próxima página (usar em `after`). `null` na última página.
        before:
          type: string
          nullable: true
          description: Cursor da página anterior (usar em `before`). `null` na primeira página.
    Product:
      type: object
      description: 'Os dados do seu produto.

        O campo `cycle` indica se o produto é uma assinatura (subscription). Quando `null`, o produto é avulso (pagamento único). Valores possíveis definem a recorrência da assinatura.

        A moeda (`currency`) é sempre `BRL`.

        '
      required:
      - externalId
      - name
      - description
      - price
      - devMode
      - currency
      - createdAt
      - updatedAt
      - status
      - id
      additionalProperties: false
      properties:
        externalId:
          type: string
          description: Identificador único do produto no seu sistema
          example: prod-123
        name:
          type: string
          description: Nome do produto
          example: Produto Exemplo
        description:
          type: string
          description: Descrição do produto
          example: Descrição do produto
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: URL da imagem do produto
          example: null
        price:
          type: number
          description: Preço do produto em centavos
          example: 10000
        devMode:
          type: boolean
          description: Indica se o produto foi criado em ambiente de testes
          example: false
        currency:
          type: string
          description: Moeda do produto (sempre BRL)
          enum:
          - BRL
          example: BRL
        createdAt:
          type: string
          format: date-time
          description: Data de criação do produto
          example: '2024-11-04T18:38:28.573Z'
        updatedAt:
          type: string
          format: date-time
          description: Data de atualização do produto
          example: '2024-11-04T18:38:28.573Z'
        status:
          type: string
          description: Status atual do produto (ProductStatus)
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        id:
          type: string
          description: Identificador único público do produto
          example: prod_abc123xyz
        cycle:
          type: string
          nullable: true
          description: 'Indica se o produto é uma assinatura (ProductCycle). Quando `null`, o produto é avulso (pagamento único).

            Valores possíveis definem a recorrência da assinatura.

            '
          enum:
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - SEMIANNUALLY
          - ANNUALLY
          example: null
        hasFile:
          type: boolean
          description: 'Indica se o produto possui um arquivo PDF vinculado para download. Quando `true`, o comprador recebe acesso ao arquivo após o pagamento.

            '
          example: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Todas as requisições devem incluir sua chave de API no header Authorization usando o formato `Bearer <abacatepay-api-key>`. Sem esse header a requisição será rejeitada.


        Saiba mais sobre como criar e usar chaves de API na [documentação de autenticação](/pages/authentication).

        '
