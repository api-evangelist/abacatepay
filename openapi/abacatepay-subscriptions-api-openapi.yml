openapi: 3.2.0
info:
  title: AbacatePay Subscriptions API
  description: API para gerenciamento de cobranças e pagamentos usando o AbacatePay.
  version: 1.0.0
servers:
- url: https://api.abacatepay.com/v2
  description: Único servidor para os ambientes de produção e sandbox.
tags:
- name: Subscriptions
paths:
  /subscriptions/create:
    post:
      summary: Criar uma nova assinatura (Checkout de assinatura)
      description: 'Cria um Checkout de assinatura — uma página de pagamento igual ao Checkout comum, mas para cobrança recorrente.


        Aceita os mesmos parâmetros do Checkout (`returnUrl`, `completionUrl`, `customerId`, `externalId`, `metadata`, `coupons`, `methods`). O Checkout de assinatura aceita **apenas um produto**; o ciclo (frequência) já deve estar definido no produto ao criá-lo na loja — não é enviado no checkout.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Mesmos parâmetros do Checkout, com `items` contendo exatamente um item (`id` e `quantity`).

                O produto referenciado deve ter sido criado com ciclo de assinatura (frequency) na loja.

                '
              required:
              - items
              additionalProperties: false
              example:
                items:
                - id: prod-1234
                  quantity: 1
                customerId: cust_abc123xyz
                methods:
                - CARD
              properties:
                items:
                  type: array
                  description: 'Lista com **exatamente um** item. O produto deve ter sido criado com ciclo de assinatura (frequency).

                    O valor total é calculado a partir do produto.

                    '
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                    - id
                    - quantity
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: ID público do produto na sua loja (produto criado com ciclo de assinatura).
                        example: prod-1234
                      quantity:
                        type: integer
                        description: Quantidade (geralmente 1 para assinatura).
                        minimum: 1
                        example: 1
                methods:
                  type: array
                  description: Métodos de pagamento disponíveis. Assinaturas suportam apenas CARD. Padrão ["CARD"].
                  items:
                    type: string
                    enum:
                    - PIX
                    - CARD
                  minItems: 1
                  default:
                  - CARD
                returnUrl:
                  type: string
                  format: uri
                  description: URL para onde o cliente será redirecionado ao clicar em "Voltar" no checkout.
                completionUrl:
                  type: string
                  format: uri
                  description: URL para onde o cliente será redirecionado após o pagamento ser concluído.
                customerId:
                  type: string
                  description: 'ID de um cliente já cadastrado na sua loja.

                    Se informado, o checkout será pré-preenchido com os dados deste cliente.

                    '
                coupons:
                  type: array
                  description: Lista de cupons que podem ser utilizados nesta cobrança.
                  items:
                    type: string
                  maxItems: 50
                externalId:
                  type: string
                  description: ID da assinatura no seu sistema, caso queira manter uma referência própria.
                metadata:
                  type: object
                  description: Metadados adicionais. Campo livre para a sua aplicação.
                  additionalProperties: true
                card:
                  type: object
                  description: Configuração do pagamento por cartão. Só tem efeito quando `methods` inclui `CARD`.
                  additionalProperties: false
                  required:
                  - maxInstallments
                  properties:
                    maxInstallments:
                      type: integer
                      description: Número máximo de parcelas oferecidas no checkout.
                      minimum: 1
                      maximum: 12
                      example: 12
                upSellProductId:
                  type: string
                  description: 'ID de um produto avulso (sem `cycle`) a ser ofertado como upsell após a conclusão do pagamento.


                    O produto deve estar com `status: ACTIVE` e **não pode ter `cycle`** — apenas produtos de pagamento único são aceitos.


                    **Exemplo**: `"prod_bump456xyz"`

                    '
                  x-mint:
                    hidden: true
                dueDate:
                  type: string
                  format: date
                  description: 'Data de vencimento do boleto no formato `YYYY-MM-DD` (ex: `"2026-08-15"`). Opcional. Só é válido quando `methods` inclui `BOLETO`; ignorado nos demais métodos.


                    Se omitido, o vencimento padrão é de 3 dias úteis. Não pode ser data no passado. Máximo de 365 dias no futuro.

                    '
                  example: '2026-08-15'
                  x-mint:
                    hidden: true
                interest:
                  description: Juros por atraso, aplicados apenas quando `methods` inclui `BOLETO`. Ignorado para PIX/CARD.
                  allOf:
                  - $ref: '#/components/schemas/BoletoInterest'
                  x-mint:
                    hidden: true
                fine:
                  description: Multa por atraso, aplicada apenas quando `methods` inclui `BOLETO`. Ignorado para PIX/CARD.
                  allOf:
                  - $ref: '#/components/schemas/BoletoFine'
                  x-mint:
                    hidden: true
                retryPolicy:
                  type: object
                  description: Política de novas tentativas quando uma cobrança da assinatura falha. Se omitida, a assinatura usa 3 tentativas com 1 dia de intervalo.
                  additionalProperties: false
                  properties:
                    maxRetry:
                      type: integer
                      description: Número máximo de tentativas de cobrança antes de a assinatura ser cancelada automaticamente.
                      minimum: 1
                      maximum: 10
                      default: 3
                      example: 3
                    retryEvery:
                      type: integer
                      description: Dias entre cada tentativa.
                      minimum: 1
                      maximum: 30
                      default: 1
                      example: 1
      responses:
        '200':
          description: Checkout de assinatura criado com sucesso. Use a `url` retornada para redirecionar o cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Subscriptions
      operationId: postSubscriptionsCreate
      x-operation-id-source: derived
  /subscriptions/list:
    get:
      summary: Listar assinaturas
      description: 'Retorna as assinaturas (`subs_...`) da sua loja, com paginação por cursor.


        A assinatura só existe depois que o cliente paga o checkout de assinatura. Para listar os checkouts de assinatura (`bill_...`), inclusive os que ainda não foram pagos, use `GET /subscriptions/checkouts/list`.


        Cada assinatura traz o `checkoutId` do checkout que a originou. Um mesmo checkout pode gerar várias assinaturas, uma por cliente que o pagou; use o filtro `checkoutId` para encontrá-las.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/QueryAfter'
      - $ref: '#/components/parameters/QueryBefore'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryStartDate'
      - $ref: '#/components/parameters/QueryEndDate'
      - name: status
        in: query
        description: Filtrar por status da assinatura
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
      - name: checkoutId
        in: query
        description: Filtrar pelo checkout de assinatura que originou a assinatura. Um checkout inexistente retorna lista vazia.
        required: false
        schema:
          type: string
          example: bill_abc123xyz
      responses:
        '200':
          description: Lista de assinaturas retornada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de assinaturas.
                    items:
                      $ref: '#/components/schemas/Subscription'
                  success:
                    $ref: '#/components/schemas/Success'
                  error:
                    type: string
                    nullable: true
                    example: null
                  pagination:
                    $ref: '#/components/schemas/PaginationCursor'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Subscriptions
      operationId: getSubscriptionsList
      x-operation-id-source: derived
  /subscriptions/get:
    get:
      summary: Buscar uma assinatura
      description: 'Retorna os dados de uma assinatura (`subs_...`).


        Informe ao menos um entre `id`, `externalId` e `customerId`. Sem nenhum deles, a API retorna `Provide id, externalId or customerId`. Quando o filtro casa mais de uma assinatura (por exemplo, um cliente com várias), a mais recente é retornada.


        Para buscar o checkout de assinatura (`bill_...`), use `GET /subscriptions/checkouts/get`.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        description: Identificador único da assinatura
        required: false
        schema:
          type: string
          example: subs_abc123xyz
      - name: externalId
        in: query
        description: '`externalId` informado ao criar o checkout de assinatura que originou a assinatura'
        required: false
        schema:
          type: string
          example: assinatura-123
      - name: customerId
        in: query
        description: Identificador do cliente dono da assinatura
        required: false
        schema:
          type: string
          example: cust_abc123xyz
      responses:
        '200':
          description: Assinatura encontrada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Subscription not found
      tags:
      - Subscriptions
      operationId: getSubscriptionsGet
      x-operation-id-source: derived
  /subscriptions/checkouts/get:
    get:
      summary: Buscar um checkout de assinatura
      description: 'Retorna um checkout de assinatura (`bill_...` com `frequency: SUBSCRIPTION`), criado via `POST /subscriptions/create`. O formato é o mesmo do `GET /checkouts/get`.


        Informe ao menos um entre `id`, `externalId` e `customerId`.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        description: Identificador único do checkout de assinatura
        required: false
        schema:
          type: string
          example: bill_abc123xyz
      - name: externalId
        in: query
        description: Identificador do checkout no seu sistema
        required: false
        schema:
          type: string
          example: assinatura-123
      - name: customerId
        in: query
        description: Identificador do cliente associado
        required: false
        schema:
          type: string
          example: cust_abc123xyz
      - name: method
        in: query
        description: Método de pagamento. Casa o checkout que oferece este método, mesmo que ofereça outros também.
        required: false
        schema:
          type: string
          enum:
          - PIX
          - CARD
      responses:
        '200':
          description: Checkout de assinatura encontrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Checkout de assinatura não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Billing not found
      tags:
      - Subscriptions
      operationId: getSubscriptionsCheckoutsGet
      x-operation-id-source: derived
  /subscriptions/checkouts/list:
    get:
      summary: Listar checkouts de assinatura
      description: 'Retorna os checkouts de assinatura (`bill_...` com `frequency: SUBSCRIPTION`) da sua loja, pagos ou não, com paginação por cursor. O formato de cada item é o mesmo do `GET /checkouts/list`.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/QueryAfter'
      - $ref: '#/components/parameters/QueryBefore'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryStartDate'
      - $ref: '#/components/parameters/QueryEndDate'
      - name: id
        in: query
        description: Filtrar por identificador único do checkout
        required: false
        schema:
          type: string
          example: bill_abc123xyz
      - name: externalId
        in: query
        description: Filtrar por identificador do checkout no seu sistema
        required: false
        schema:
          type: string
          example: assinatura-123
      - name: status
        in: query
        description: Filtrar por status do checkout
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - EXPIRED
          - CANCELLED
          - PAID
          - REFUNDED
      - name: keyword
        in: query
        description: Busca textual livre
        required: false
        schema:
          type: string
      - name: customerId
        in: query
        description: Filtrar pelo identificador do cliente associado
        required: false
        schema:
          type: string
          example: cust_abc123xyz
      - name: method
        in: query
        description: Filtrar por método de pagamento. Traz todo checkout que oferece este método, mesmo que ofereça outros também.
        required: false
        schema:
          type: string
          enum:
          - PIX
          - CARD
      responses:
        '200':
          description: Checkouts de assinatura listados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de checkouts de assinatura.
                    items:
                      $ref: '#/components/schemas/Billing'
                  success:
                    $ref: '#/components/schemas/Success'
                  error:
                    type: string
                    nullable: true
                    example: null
                  pagination:
                    $ref: '#/components/schemas/PaginationCursor'
        '401':
          description: Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Subscriptions
      operationId: getSubscriptionsCheckoutsList
      x-operation-id-source: derived
  /subscriptions/checkouts/delete:
    post:
      summary: Deletar um checkout de assinatura
      description: 'Exclui um checkout de assinatura (`bill_...` com `frequency: SUBSCRIPTION`), que deixa de aparecer nas listagens.


        As assinaturas que o checkout já gerou continuam ativas. Para encerrá-las, use `POST /subscriptions/cancel`.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        description: Identificador único do checkout de assinatura
        required: true
        schema:
          type: string
          example: bill_abc123xyz
      responses:
        '200':
          description: Checkout de assinatura excluído com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token de autenticação inválido ou ausente.
      tags:
      - Subscriptions
      operationId: postSubscriptionsCheckoutsDelete
      x-operation-id-source: derived
  /subscriptions/cancel:
    post:
      summary: Cancelar uma assinatura
      description: 'Cancela imediatamente uma assinatura ativa.


        A assinatura passa para o status `CANCELLED` e nenhuma cobrança futura será gerada. Esta operação é irreversível.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: Identificador único da assinatura a ser cancelada
                  example: subs_abc123xyz
      responses:
        '200':
          description: Assinatura cancelada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro indicando que a assinatura não foi encontrada.
                    example: Subscription not found
      tags:
      - Subscriptions
      operationId: postSubscriptionsCancel
      x-operation-id-source: derived
  /subscriptions/change-plan:
    post:
      summary: Alterar plano da assinatura
      description: 'Altera o produto principal de uma assinatura ativa.


        A mudança é agendada como `PENDING` e aplicada automaticamente no início do próximo ciclo de cobrança. Só pode existir uma alteração pendente por assinatura — uma nova chamada substitui a anterior ainda não aplicada.


        O produto informado em `productId` deve ter um ciclo de cobrança definido, igual ao da assinatura. Produtos avulsos (sem ciclo) retornam erro.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: Identificador único da assinatura a ser alterada.
                  example: subs_abc123xyz
                productId:
                  type: string
                  description: Identificador do novo produto. Deve ter ciclo de cobrança definido.
                  example: prod_plano_pro
                quantity:
                  type: integer
                  minimum: 1
                  description: Quantidade do novo produto.
                  example: 1
                items:
                  type: array
                  description: Lista de produtos do novo plano. Alternativa a `productId`/`quantity` quando a assinatura passa a ter mais de um produto.
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - productId
                    - quantity
                    properties:
                      productId:
                        type: string
                        example: prod_abc123xyz
                      quantity:
                        type: integer
                        minimum: 1
                        example: 1
      responses:
        '200':
          description: Alteração de plano agendada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubscriptionUpdate'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Assinatura ou produto não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Subscription not found or not active
        '422':
          description: 'Dados inválidos (ex: produto sem ciclo).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Product must have a billing cycle
      tags:
      - Subscriptions
      operationId: postSubscriptionsChangePlan
      x-operation-id-source: derived
  /subscriptions/record-usage:
    post:
      summary: Registrar uso
      description: 'Registra unidades de uso de um produto avulso (pay-as-you-go) em uma assinatura ativa.


        O registro é vinculado à próxima parcela pendente da assinatura e incluído na cobrança do ciclo atual. Use `action: "add"` para acrescentar unidades e `action: "subtract"` para estornar unidades já registradas.


        O produto informado em `productId` **não** deve ter ciclo de cobrança. Produtos de assinatura (com ciclo) retornam erro.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - productId
              - units
              - action
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: Identificador único da assinatura.
                  example: subs_abc123xyz
                productId:
                  type: string
                  description: Identificador do produto de uso. Não deve ter ciclo de cobrança.
                  example: prod_api_calls
                units:
                  type: integer
                  minimum: 1
                  description: Quantidade de unidades a registrar.
                  example: 50
                action:
                  type: string
                  enum:
                  - add
                  - subtract
                  description: '`add` para acrescentar unidades à próxima cobrança; `subtract` para estornar unidades já registradas no ciclo.'
                  example: add
      responses:
        '200':
          description: Uso registrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubscriptionUsageRecord'
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token de autenticação inválido ou ausente.
        '404':
          description: Assinatura ou produto não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Subscription not found or not active
        '422':
          description: 'Dados inválidos (ex: produto com ciclo enviado em vez de produto avulso).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Product must not have a billing cycle
      tags:
      - Subscriptions
      operationId: postSubscriptionsRecordUsage
      x-operation-id-source: derived
components:
  schemas:
    BoletoFine:
      type: object
      description: 'Multa por atraso aplicada uma única vez após o vencimento do boleto. One-time late fine applied after the due date. Aplica-se apenas a `method: "BOLETO"`; ignorado nos demais métodos.'
      additionalProperties: false
      required:
      - value
      - type
      properties:
        value:
          type: integer
          minimum: 0
          description: 'Quando `type = "PERCENTAGE"`: centésimos de percentual sobre o valor do boleto (`200` = 2%). Quando `type = "FIXED"`: valor fixo em centavos (`1000` = R$ 10,00). Quando `0` ou omitido, sem multa.

            EN: With `type: "PERCENTAGE"`, value is in hundredths of a percent (`200` = 2%). With `type: "FIXED"`, value is in cents (`1000` = R$ 10.00). `0` or omitted disables the fine.'
          example: 200
        type:
          type: string
          description: 'Tipo da multa. `PERCENTAGE` aplica percentual sobre o valor do boleto; `FIXED` aplica um valor fixo em centavos.

            EN: Fine type. `PERCENTAGE` applies a percent of the boleto amount; `FIXED` applies a fixed amount in cents.'
          enum:
          - PERCENTAGE
          - FIXED
          example: PERCENTAGE
    SubscriptionUsageRecord:
      type: object
      description: Registro de uso de um produto avulso em uma assinatura.
      required:
      - id
      - subscriptionId
      - productId
      - units
      - unitPrice
      - action
      - installmentNumber
      - recordedAt
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identificador único do registro de uso.
          example: usgr_abc123xyz
        subscriptionId:
          type: string
          description: Identificador da assinatura associada.
          example: subs_abc123xyz
        productId:
          type: string
          description: Identificador do produto de uso.
          example: prod_api_calls
        units:
          type: integer
          description: Quantidade de unidades registradas.
          example: 50
        unitPrice:
          type: integer
          description: Preço unitário em centavos no momento do registro.
          example: 100
        action:
          type: string
          description: Tipo de ação aplicada ao uso.
          enum:
          - add
          - subtract
          example: add
        installmentNumber:
          type: integer
          description: Número da parcela em que este uso será cobrado.
          example: 2
        recordedAt:
          type: string
          format: date-time
          description: Data e hora do registro.
          example: '2024-12-06T20:10:00.000Z'
    SubscriptionUpdate:
      type: object
      description: Atualização de plano pendente de uma assinatura.
      required:
      - id
      - subscriptionId
      - status
      - productId
      - quantity
      - newAmount
      - requestedAt
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identificador único da atualização de plano.
          example: subu_abc123xyz
        subscriptionId:
          type: string
          description: Identificador da assinatura associada.
          example: subs_abc123xyz
        status:
          type: string
          description: Status da atualização.
          enum:
          - PENDING
          - APPLIED
          - CANCELLED
          example: PENDING
        productId:
          type: string
          description: Identificador do novo produto.
          example: prod_plano_pro
        quantity:
          type: integer
          description: Quantidade do novo produto.
          example: 1
        newAmount:
          type: integer
          description: Novo valor a ser cobrado por ciclo, em centavos (preço × quantidade).
          example: 4990
        requestedAt:
          type: string
          format: date-time
          description: Data e hora em que a alteração foi solicitada.
          example: '2024-12-06T20:05:00.000Z'
    BoletoInterest:
      type: object
      description: 'Juros por atraso aplicados ao boleto após o vencimento. Late interest applied to the boleto after the due date. Aplica-se apenas a `method: "BOLETO"`; ignorado nos demais métodos.'
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: integer
          minimum: 0
          description: 'Percentual de juros ao mês em centésimos de percentual (`100` = 1% ao mês, `250` = 2,5% ao mês). Quando `0` ou omitido, sem juros. Calculado pro rata die após o vencimento.

            EN: Monthly late-interest rate in hundredths of a percent (`100` = 1%/month). Accrues pro rata die after the due date; `0` or omitted disables interest.'
          example: 100
    Billing:
      type: object
      properties:
        id:
          type: string
          description: Identificador único do Checkout.
          example: bill_abc123xyz
        externalId:
          type: string
          nullable: true
          description: ID do Checkout no seu sistema.
          example: pedido-123
        url:
          type: string
          format: uri
          description: URL onde o usuário pode concluir o pagamento.
          example: https://app.abacatepay.com/pay/bill_abc123xyz
        amount:
          type: number
          description: Valor total a ser pago em centavos.
          example: 10000
        paidAmount:
          type: number
          nullable: true
          description: Valor já pago em centavos. Null se ainda não foi pago.
          example: null
        items:
          type: array
          description: Lista de itens no Checkout.
          items:
            type: object
            properties:
              id:
                type: string
                description: ID do produto.
                example: prod_456
              quantity:
                type: integer
                description: Quantidade do item.
                example: 2
        status:
          type: string
          description: Status atual do Checkout.
          enum:
          - PENDING
          - EXPIRED
          - CANCELLED
          - PAID
          - REFUNDED
          example: PENDING
        coupons:
          type: array
          description: Lista de cupons aplicados no Checkout.
          items:
            type: string
          example: []
        devMode:
          type: boolean
          description: Indica se a cobrança foi criada em ambiente de testes.
          example: false
        customerId:
          type: string
          nullable: true
          description: ID do cliente associado ao Checkout.
          example: null
        returnUrl:
          type: string
          format: uri
          nullable: true
          description: URL para onde o cliente será redirecionado ao clicar em "Voltar".
          example: null
        completionUrl:
          type: string
          format: uri
          nullable: true
          description: URL para onde o cliente será redirecionado após o pagamento.
          example: null
        receiptUrl:
          type: string
          format: uri
          nullable: true
          description: URL do comprovante de pagamento.
          example: null
        upSellProductId:
          type: string
          nullable: true
          description: ID do produto de upsell vinculado ao Checkout. Null se nenhum produto de upsell foi informado na criação.
          example: prod_bump456xyz
        installmentsCount:
          type: integer
          nullable: true
          description: Número de parcelas do pagamento quando realizado via Cartão de crédito com mais de uma parcela. `null` para pagamentos à vista ou realizados por outros métodos (PIX, Boleto).
          example: 3
        dueDate:
          type: string
          format: date
          nullable: true
          description: Data de vencimento do boleto (`YYYY-MM-DD`). `null` quando não foi configurada ou quando o método de pagamento não é BOLETO.
          example: '2026-08-15'
        interest:
          nullable: true
          description: Juros por atraso configurados para o boleto. `null` quando não foi configurado ou quando o método de pagamento não é BOLETO.
          allOf:
          - $ref: '#/components/schemas/BoletoInterest'
        fine:
          nullable: true
          description: Multa por atraso configurada para o boleto. `null` quando não foi configurada ou quando o método de pagamento não é BOLETO.
          allOf:
          - $ref: '#/components/schemas/BoletoFine'
        metadata:
          type: object
          description: Metadados adicionais do Checkout.
          additionalProperties: true
          example: {}
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação do Checkout.
          example: '2024-11-04T18:38:28.573Z'
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização do Checkout.
          example: '2024-11-04T18:38:28.573Z'
    PaginationCursor:
      type: object
      description: Informações de paginação baseada em cursor.
      required:
      - hasMore
      - next
      - before
      additionalProperties: false
      properties:
        hasMore:
          type: boolean
          description: Indica se existe uma próxima página.
        next:
          type: string
          nullable: true
          description: Cursor da próxima página (usar em `after`). `null` na última página.
        before:
          type: string
          nullable: true
          description: Cursor da página anterior (usar em `before`). `null` na primeira página.
    Success:
      type: boolean
      description: Se a requisição obteve sucesso ou não.
      example: true
    Subscription:
      type: object
      description: Dados de uma assinatura (`subs_...`). Existe a partir do pagamento do checkout de assinatura que a originou (`checkoutId`).
      required:
      - id
      - checkoutId
      - customerId
      - amount
      - status
      - method
      - coupons
      - devMode
      - trialDays
      - trialEndsAt
      - retryPolicy
      - createdAt
      - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identificador único da assinatura.
          example: subs_abc123xyz
        checkoutId:
          type: string
          nullable: true
          description: Checkout de assinatura (`bill_...`) que originou a assinatura. Um checkout pode originar várias assinaturas, uma por cliente pagante.
          example: bill_abc123xyz
        customerId:
          type: string
          description: Identificador do cliente que possui a assinatura.
          example: cust_abc123xyz
        amount:
          type: number
          description: Valor da assinatura em centavos.
          example: 10000
        status:
          type: string
          description: Status atual da assinatura.
          enum:
          - PENDING
          - ACTIVE
          - CANCELLED
          example: ACTIVE
        method:
          type: string
          description: Método de pagamento da assinatura.
          enum:
          - PIX
          - CARD
          example: CARD
        coupons:
          type: array
          items:
            type: string
          description: Cupons aplicados.
          example: []
        devMode:
          type: boolean
          description: Indica se a assinatura foi criada em ambiente de testes.
          example: false
        trialDays:
          type: integer
          nullable: true
          description: Duração do período de teste em dias; `null` sem trial.
          example: null
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Fim do período de teste; `null` sem trial.
          example: null
        retryPolicy:
          type: object
          description: Política de retentativa de cobrança.
          properties:
            maxRetry:
              type: integer
              example: 3
            retryEvery:
              type: integer
              example: 1
        createdAt:
          type: string
          format: date-time
          description: Data de criação da assinatura.
          example: '2024-11-04T18:38:28.573Z'
        updatedAt:
          type: string
          format: date-time
          description: Data de atualização da assinatura.
          example: '2024-11-04T18:38:28.573Z'
  parameters:
    QueryStartDate:
      name: startDate
      in: query
      description: 'Filtra registros criados a partir desta data (inclusive). Formato `YYYY-MM-DD`. O intervalo é interpretado no fuso horário `America/Sao_Paulo` (00:00 do dia inicial).

        '
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-01'
    QueryEndDate:
      name: endDate
      in: query
      description: 'Filtra registros criados até esta data (inclusive). Formato `YYYY-MM-DD`. O intervalo é interpretado no fuso horário `America/Sao_Paulo` (23:59:59.999 do dia final).

        '
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-31'
    QueryLimit:
      name: limit
      in: query
      description: Quantidade de itens por página (1-100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
        example: 100
    QueryAfter:
      name: after
      in: query
      description: Cursor para buscar itens após este ponto (use o `publicId` retornado em `pagination.next`).
      required: false
      schema:
        type: string
    QueryBefore:
      name: before
      in: query
      description: Cursor para buscar itens antes deste ponto (use o `publicId` retornado em `pagination.before`).
      required: false
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Todas as requisições devem incluir sua chave de API no header Authorization usando o formato `Bearer <abacatepay-api-key>`. Sem esse header a requisição será rejeitada.


        Saiba mais sobre como criar e usar chaves de API na [documentação de autenticação](/pages/authentication).

        '
