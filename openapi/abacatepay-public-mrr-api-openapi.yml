openapi: 3.2.0
info:
  title: AbacatePay Public Mrr API
  description: API para gerenciamento de cobranças e pagamentos usando o AbacatePay.
  version: 1.0.0
servers:
- url: https://api.abacatepay.com/v2
  description: Único servidor para os ambientes de produção e sandbox.
tags:
- name: Public Mrr
paths:
  /public-mrr/merchant-info:
    get:
      summary: Obter informações do merchant
      description: Retorna informações básicas da loja (ID, nome, website, data de criação e país). Use o token `mrr_` gerado no app Trust MRR.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Informações do merchant retornadas com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identificador único da loja
                        example: store_abc123xyz
                      name:
                        type: string
                        description: Nome da loja
                        example: Example Tech
                      website:
                        type: string
                        description: Website da loja
                        example: https://www.example.com
                      createdAt:
                        type: string
                        format: date-time
                        description: Data de criação da loja
                        example: '2024-12-06T18:53:31.756Z'
                      country:
                        type: string
                        description: País da loja
                        example: BR
                    required:
                    - id
                    - name
                    - website
                    - createdAt
                    - country
                    additionalProperties: false
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Unauthorized
      tags:
      - Public Mrr
      operationId: getPublicMrrMerchantInfo
      x-operation-id-source: derived
  /public-mrr/mrr:
    get:
      summary: Obter MRR (Monthly Recurring Revenue)
      description: 'Retorna o MRR (receita recorrente mensal) e o total de assinaturas ativas da loja. Os dois campos são objetos: o número fica em `value`. Use o token `mrr_` gerado no app Trust MRR.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dados de MRR retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mrr:
                        type: object
                        description: Receita recorrente mensal das assinaturas pagantes. O valor em centavos fica em `value`; cada assinatura entra com o valor de um mês (a anual conta 1/12, a trimestral 1/3). 0 indica que não há receita recorrente.
                        required:
                        - currency
                        - value
                        properties:
                          currency:
                            type: string
                            example: BRL
                          value:
                            type: number
                            example: 129900
                      totalActiveSubscriptions:
                        type: object
                        description: Assinaturas ativas, incluindo as em período de teste. A quantidade fica em `value`.
                        required:
                        - currency
                        - value
                        properties:
                          currency:
                            type: string
                            example: BRL
                          value:
                            type: integer
                            example: 12
                    required:
                    - mrr
                    - totalActiveSubscriptions
                    additionalProperties: false
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Unauthorized
      tags:
      - Public Mrr
      operationId: getPublicMrrMrr
      x-operation-id-source: derived
  /public-mrr/mrr-by-day:
    get:
      summary: Obter MRR por dia
      description: Retorna o MRR do fim de cada dia (horário de Brasília) entre `startDate` e `endDate`, com a mesma conta de `/public-mrr/mrr`. O período pode ter até 366 dias. Use o token `mrr_` gerado no app Trust MRR.
      security:
      - bearerAuth: []
      parameters:
      - name: startDate
        in: query
        required: true
        description: Primeiro dia do período (formato YYYY-MM-DD)
        schema:
          type: string
          format: date
          example: '2024-01-15'
      - name: endDate
        in: query
        required: true
        description: Último dia do período (formato YYYY-MM-DD)
        schema:
          type: string
          format: date
          example: '2024-01-16'
      responses:
        '200':
          description: MRR de cada dia do período.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Uma chave por dia (YYYY-MM-DD), com o MRR em centavos no fim daquele dia.
                    additionalProperties:
                      type: object
                      properties:
                        mrr:
                          type: number
                          description: MRR em centavos no fim do dia
                          example: 129900
                      required:
                      - mrr
                      additionalProperties: false
                    example:
                      '2024-01-15':
                        mrr: 129900
                      '2024-01-16':
                        mrr: 134900
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '400':
          description: Erro de validação. Datas inválidas ou período maior que 366 dias.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o problema de validação.
                    example: Date range must be at most 366 days
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
      tags:
      - Public Mrr
      operationId: getPublicMrrMrrByDay
      x-operation-id-source: derived
  /public-mrr/revenue:
    get:
      summary: Obter receita por período
      description: Retorna a receita total, total de transações e transações por dia em um período específico. Os dados são cacheados por 1 hora (3600 segundos) para melhor performance. A data de fim deve ser posterior à data de início. Use o token `mrr_` gerado no app Trust MRR.
      security:
      - bearerAuth: []
      parameters:
      - name: startDate
        in: query
        required: true
        description: Data de início do período (formato YYYY-MM-DD)
        schema:
          type: string
          format: date
          example: '2024-01-01'
      - name: endDate
        in: query
        required: true
        description: Data de fim do período (formato YYYY-MM-DD)
        schema:
          type: string
          format: date
          example: '2024-01-31'
      responses:
        '200':
          description: Dados de receita retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalRevenue:
                        type: number
                        description: Receita total do período em centavos
                        example: 150000
                      totalTransactions:
                        type: integer
                        description: Total de transações no período
                        example: 45
                      transactionsPerDay:
                        type: object
                        description: Objeto com transações agrupadas por dia (chave é a data no formato YYYY-MM-DD)
                        additionalProperties:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Valor total das transações do dia em centavos
                              example: 5000
                            count:
                              type: integer
                              description: Quantidade de transações do dia
                              example: 3
                          required:
                          - amount
                          - count
                          additionalProperties: false
                        example:
                          '2024-01-15':
                            amount: 5000
                            count: 3
                          '2024-01-16':
                            amount: 3000
                            count: 2
                    required:
                    - totalRevenue
                    - totalTransactions
                    - transactionsPerDay
                    additionalProperties: false
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    $ref: '#/components/schemas/Success'
        '400':
          description: Erro de validação. Parâmetros inválidos ou ausentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o problema de validação.
                    example: End date must be after start date
        '401':
          description: Não autorizado. Falha na autenticação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro descrevendo o motivo da falha na autenticação.
                    example: Unauthorized
      tags:
      - Public Mrr
      operationId: getPublicMrrRevenue
      x-operation-id-source: derived
components:
  schemas:
    Success:
      type: boolean
      description: Se a requisição obteve sucesso ou não.
      example: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Todas as requisições devem incluir sua chave de API no header Authorization usando o formato `Bearer <abacatepay-api-key>`. Sem esse header a requisição será rejeitada.


        Saiba mais sobre como criar e usar chaves de API na [documentação de autenticação](/pages/authentication).

        '
