name: AbacatePay
kind: company
description: AbacatePay is a Brazilian payment gateway built for developers and indie
  hackers, focused on instant Pix payments. Its REST API lets you create billings
  and charges, generate and check Pix QR Codes, manage customers and coupons, request
  withdrawals, and receive webhooks - charging a flat per-transaction Pix fee with
  funds available immediately.
